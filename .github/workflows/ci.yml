name: Smart Restaurant CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  # Backend CI
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Create .env file
      run: |
        echo "NODE_ENV=test" > .env
        echo "PORT=5001" >> .env
        echo "DATABASE_URL=postgresql://test_user:test_password@localhost:5432/test_db" >> .env
        echo "JWT_SECRET=test_jwt_secret_key_for_ci" >> .env
        echo "JWT_REFRESH_SECRET=test_refresh_secret_key_for_ci" >> .env
        echo "GOOGLE_CLIENT_ID=test_google_client_id" >> .env
        echo "GOOGLE_CLIENT_SECRET=test_google_client_secret" >> .env
        echo "FRONTEND_URL=http://localhost:5173" >> .env
        echo "QR_BASE_URL=http://localhost:5173" >> .env

    - name: Run Prisma migrations
      run: |
        npx prisma generate
        npx prisma db push

    - name: Lint code
      run: npm run lint || echo "No lint script found"

    - name: Run tests
      run: npm test || echo "No tests found"
      env:
        NODE_ENV: test

    - name: Check if server starts
      run: |
        timeout 30s npm start &
        sleep 5
        curl -f http://localhost:5001/api/health || echo "Health check failed"
        pkill -f "node"

  # Frontend CI  
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Create .env file
      run: |
        echo "VITE_API_BASE_URL=http://localhost:5001/api" > .env
        echo "VITE_API_URL=http://localhost:5001/api" >> .env
        echo "VITE_APP_NAME=Smart Restaurant" >> .env
        echo "VITE_APP_VERSION=1.0.0" >> .env
        echo "VITE_ENABLE_QR_GENERATION=true" >> .env
        echo "VITE_ENABLE_ANALYTICS=true" >> .env
        echo "VITE_DEFAULT_RESTAURANT_ID=1" >> .env
        echo "VITE_ENV=development" >> .env

    - name: Lint code
      run: npm run lint || echo "No lint script found"

    - name: Run tests
      run: npm test || echo "No tests found"

    - name: Build project
      run: npm run build

    - name: Check build artifacts
      run: |
        ls -la dist/
        echo "Build completed successfully"

  # Integration Tests (optional)
  integration:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install backend dependencies
      working-directory: ./backend
      run: npm ci

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Setup backend environment
      working-directory: ./backend
      run: |
        echo "NODE_ENV=test" > .env
        echo "PORT=5001" >> .env
        echo "DATABASE_URL=postgresql://test_user:test_password@localhost:5432/test_db" >> .env
        echo "JWT_SECRET=test_jwt_secret_key_for_ci" >> .env
        echo "JWT_REFRESH_SECRET=test_refresh_secret_key_for_ci" >> .env
        echo "FRONTEND_URL=http://localhost:5173" >> .env

    - name: Setup frontend environment
      working-directory: ./frontend
      run: |
        echo "VITE_API_URL=http://localhost:5001/api" > .env

    - name: Setup database
      working-directory: ./backend
      run: |
        npx prisma generate
        npx prisma db push

    - name: Start backend
      working-directory: ./backend
      run: |
        npm start &
        sleep 10

    - name: Build frontend
      working-directory: ./frontend
      run: npm run build

    - name: Test API endpoints
      run: |
        curl -f http://localhost:5001/api/health || echo "Backend health check failed"
        curl -f http://localhost:5001/api/restaurants || echo "Restaurants endpoint failed"

    - name: Cleanup
      run: pkill -f "node" || true